version: '3.8'

# 单机全栈部署（阿里云国际站 香港/新加坡 轻量应用服务器）
# 三服务：db(Postgres) + backend(Django/gunicorn) + nginx(反代 API + 托管前端 dist)
# 大数据集 bioprocorpus 通过主机 ./data 绑定挂载，一次性上传后常驻持久盘，不进镜像。
# 用法：
#   cp deploy/.env.example .env   # 改 SECRET_KEY / 密码 / 域名
#   cd frontend && VITE_API_BASE_URL=https://<域名>/api/v1 ./build-cloudflare.sh   # 产出 dist
#   mkdir -p data/bioprocorpus && scp -r 本机backend/data/bioprocorpus/* <host>:<repo>/data/bioprocorpus/
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-scireagent}
      POSTGRES_USER: ${DB_USER:-scireagent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scireagent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-scireagent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-scireagent}
      DB_USER: ${DB_USER:-scireagent}
      DB_PASSWORD: ${DB_PASSWORD:-scireagent}
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # 大数据集：一次性上传到主机 ./data/bioprocorpus，绑定挂载进容器（只读、常驻持久盘）
      - ./data/bioprocorpus:/app/backend/data/bioprocorpus:ro
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro          # 前端构建产物（需在 up 前先 build）
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/share/nginx/static:ro          # 后端 collectstatic 产出
      - media_volume:/usr/share/nginx/media:ro            # 用户上传媒体
      - ./deploy/certbot/conf:/etc/letsencrypt:ro         # HTTPS 证书（certbot 申请后挂载）
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume:
