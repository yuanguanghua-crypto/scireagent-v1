# SciReAgent 单机全栈 Nginx 配置（docker-compose nginx 服务挂载到 /etc/nginx/conf.d/default.conf）
# 前端 SPA 由 nginx 直接托管；/api /admin 反代到 backend:8000；/static /media 由 nginx 读挂载卷。
server {
    listen 80;
    server_name _;   # 上线后改为你的域名，并用 certbot 启用 443（见部署文档）

    client_max_body_size 20m;   # 允许上传较大文件（如 PDF 数据表）

    # ── 内部访问限制：HTTP Basic Auth（仅限内部测试人员，详见部署文档 §11）──
    # 生成账号见 deploy/generate-htpasswd.sh；密码文件由 docker-compose 挂载到容器内
    auth_basic "SciReAgent Internal Test";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # certbot 域名验证路径必须免认证，否则申请/续期 HTTPS 证书会失败（返回 401）
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /usr/share/nginx/html;
    }

    # ── 前端单页应用（SPA）：托管 dist，未匹配路由回退 index.html ──
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 后端 API（Django DRF）──
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django 管理后台 ──
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 静态资源（后端 collectstatic 产出，挂载为只读卷）──
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        access_log off;
    }

    # ── 用户上传媒体 ──
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        access_log off;
    }
}

# ── HTTPS（上线时启用）：用 certbot 申请证书后，将证书挂载到 ./deploy/certbot/conf，
