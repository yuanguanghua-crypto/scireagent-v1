# ============================================================================

method: PCR
version: 0.2

essence: "PCR is an enzymatic method that exponentially amplifies a specific region of a nucleic acid template through repeated cycles of thermal denaturation, primer annealing, and polymerase-mediated extension."

must:
  - "A nucleic acid template is present in the reaction: genomic or plasmid DNA, a cDNA, or RNA that is reverse transcribed within the protocol."
  - "The reaction mixture contains a thermostable DNA polymerase and sequence-specific oligonucleotide primers."
  - "The reaction is actually run for multiple repeated thermal cycles that alternate a high-temperature strand-separation step with primer annealing and extension steps (annealing and extension may be combined), for example in a thermal cycler; a single heating step or an incubation at one constant temperature does not meet this condition."

on_topic_requires:
  # ① v0.2 改动：从「读出」改为「交付物」
  - "The protocol's own deliverable is the DNA fragment produced by the amplification. A readout that inspects that fragment without converting it into another molecule — such as gel or capillary electrophoresis, sequencing of the product, or a melt-curve check used solely to confirm the product — is consistent with this condition."
  # ② v0.2 删除：原 otr-2「不得只是更大流程里的前置/验证步骤」
  #    删除理由：它是 D-001 的绝对否决来源，与新判定轴冲突；"是否已完成转化"改由 E5 处理。
  # ③ 改动：删除 "melt curves" 一词（v0.1 原文含此词）。
  #    理由：留着会把熔解曲线一律排除为"非对靶读出"，与 §8 的 sole-purpose 例外矛盾。
  #    其余部分逐字未改。
  - "The readout is not real-time or digital quantification, such as Ct or Cq values, amplification curves, or copy numbers counted per partition."

common_but_not_required:
  - "The type of polymerase, such as Taq or a high-fidelity enzyme, is not defining."
  - "The number of cycles, the annealing temperature, the extension time, and the buffer composition are not defining."
  - "A hot start, a final extension step, or additives such as DMSO or betaine may be used."
  - "A negative control without template or a positive control may be included."
  - "Agarose gel electrophoresis with a DNA stain is a common end-point readout, but no particular readout is required to identify the method."

exclude:
  - E1: "Primer design, sequence analysis, or annealing temperature calculation alone, where no amplification reaction is actually prepared and run."
  - E2: "Protocols whose principal deliverable is real-time or digital quantification of a target, such as Ct or Cq values, amplification or melt curves, or absolute copy numbers from partitioned reactions; the thermal-cycled amplification is only the means, and the quantitative readout belongs to the separate qPCR method."
  - E3: "Nucleic acid amplification that is not thermal-cycled PCR, such as isothermal methods (LAMP, RPA, NASBA, strand displacement or rolling circle amplification) run at a constant temperature, when no repeated thermal cycling is stated anywhere in the protocol."
  - E4: "Preparation or handling of reagents, buffers, master mixes, consumables, or kits, or cleanup of an already obtained product, without an amplification reaction being run in the protocol."
  # ③ v0.2 改动：把"前置/验证"换成"协议内是否已完成转化"
  - E5: "Protocols in which the amplification product is converted within the protocol into another molecule, such as a sequencing library, a cloned plasmid, an edited genome, or a transcribed RNA; the protocol's deliverable is then that converted molecule rather than the amplified fragment. Library preparation and sequencing that are merely named as a downstream application, and not performed inside the protocol, do not trigger this exclusion."

# ④ v0.2 改动：upstream / downstream 降为描述性分类，不再单独决定 verdict
category_definition:
  upstream: "DESCRIPTIVE ONLY — PCR runs before the protocol's principal procedure and prepares its material. Whether it is on_topic is decided by on_topic_requires and E5, NOT by this label."
  downstream: "DESCRIPTIVE ONLY — PCR runs after the protocol's principal procedure and is applied to its product. Whether it is on_topic is decided by on_topic_requires and E5, NOT by this label."
  variant: "The protocol performs thermal-cycled PCR in a recognized alternative format that stays within the cycling principle, such as hot-start, touchdown, nested, multiplex, long-range, real-time, or digital PCR."
  analogue: "The protocol uses a different but related nucleic acid amplification method that is not thermal-cycled PCR, such as LAMP, RPA, or NASBA, and does not perform PCR."
  composite: "PCR is combined with another molecular method in a single protocol, such as reverse transcription followed by end-point PCR."

# ── §6 新增：建库 / 测序 在协议内 还是 协议外（E5 的操作化清单）────────────────
deliverable_boundary:
  # ★ D-003 修复（2026-11-06）：原 rule 以"出现任一动作"为判据，会把"单次加接头/index PCR 后停止"
  #   判成文库（tangential），与 otr-1（交付带接头的扩增片段 → on_topic）冲突。
  #   现改为**链条判据**：加接头/index 必须**再接至少一个下游文库步骤**，才判文库。
  inside_protocol_actions:
    - "add adapters"
    - "library preparation"
    - "index PCR"
    - "library quantification"
    - "pooling of libraries"
    - "loading onto a sequencer"
    - "demultiplexing / FASTQ generation"
  action_qualifiers:
    add adapters: "A separate library-conversion or adapter-ligation step. It does NOT cover adapter or index sequence merely being incorporated through the PCR primers themselves."
    index PCR: "Not sufficient on its own. Whether the deliverable becomes a library depends on what follows — see rule and exception below."
  rule: "The deliverable is a library or sequencing output (so E5 applies and the verdict is tangential) only when the protocol carries out the library chain as its closing stages: adapter or index addition FOLLOWED BY at least one of library quantification, pooling of libraries, loading onto a sequencer, or demultiplexing. Adapter/index addition alone does not complete that chain."
  exception: "An adapter- or index-adding amplification that ends at the purified adapter-tagged amplicon, without subsequent library preparation, library quantification, pooling, or sequencing steps, does not by itself trigger E5; its deliverable remains the amplified DNA fragment and it may be on_topic."
  downstream_only: "If these actions appear only as a stated downstream application, or are explicitly marked as not described here, the protocol ends at the amplified fragment and the verdict may be on_topic."

# ── §7 新增：读 vs 转化 ───────────────────────────────────────────────────────
read_versus_convert:
  read: "Gel or capillary electrophoresis, sequencing of the product, and Ct/curve readouts INSPECT the fragment. Sequencing a PCR product to validate it does not convert it into another molecule."
  convert: "Ligation into a vector, transformation, library preparation, in-vitro transcription, or using the product as a template for a further reaction that is not amplification of the same target (for example in-vitro transcription or assembly) PRODUCE a different molecule."
  rule: "Inspection leaves the deliverable as the amplified fragment. Conversion replaces it. This distinction decides between on_topic and tangential."

# ── §8 新增：熔解曲线 / 特异性确认（含例外与理据）──────────────────────────────
melt_curve:
  default: "tangential — a melt curve attached to a qPCR run supports a quantitative or typing readout; the principal deliverable is the value or call."
  exception: "on_topic — if the sole purpose of the protocol is to confirm the presence or uniqueness of the amplified product by melt curve, with no quantification and no downstream conversion."
  rationale: "The test is what the protocol's sole deliverable is, not which readout technology is used. When a melt curve is the only readout, the object it inspects is the amplified fragment itself, which is an end-point readout of that fragment under on_topic_requires."

# ── pcr_role（配套字段；v0.2 草案期只落字段，不填值）────────────────────────────
pcr_role:
  field: "primary | support | none"
  meaning:
    primary: "PCR is the protocol's subject; the protocol is organized around amplification and its readout."
    support: "PCR is present but the protocol has another principal procedure (cloning, library preparation, sequencing, phenotyping) and PCR occupies only some steps."
    none: "No amplification is performed."
  constraint: "pcr_role does not participate in the verdict. It is an independent label."
  fill_timing:
    - "Drafting and discussion: field present, all values empty."
    - "After v0.2 is adopted and BEFORE the first full-scale judging: fix the primary/support criteria on a calibration set (suggested 50 items)."
    - "Only after those criteria are stable may values be filled at full scale."
    - "Before that point, pcr_role must NOT be used in any statistic, filter, or conclusion."

pos_examples:
  - {text: "Prepare a 25 microliter reaction containing genomic DNA, forward and reverse primers, dNTPs, Taq DNA polymerase, and buffer; run 30 cycles of 95 degrees C for 30 seconds, 58 degrees C for 30 seconds, and 72 degrees C for 60 seconds in a thermal cycler; resolve the product on a 1% agarose gel and image the band.", verdict: on_topic}
  - {text: "Amplify the target region by touchdown hot-start PCR, lowering the annealing temperature by 1 degree C per cycle over the first ten cycles of thermal cycling, and check the amplicon size by capillary electrophoresis.", verdict: on_topic}
  - {text: "Genotype mouse tail DNA by PCR with allele-specific primers and Taq polymerase for 35 cycles, then score the genotype from the band pattern on an agarose gel.", verdict: on_topic}

neg_examples:
  - {text: "Select forward and reverse primers for the target gene with a primer design tool, check for hairpins and primer dimers, and calculate the melting and annealing temperatures; no reaction is prepared or run.", verdict: wrong, exclude_item: E1}
  - {text: "Detect the target by recombinase polymerase amplification: mix the primers, recombinase, and polymerase, and incubate the tube at a constant 39 degrees C for 20 minutes without any thermal cycling.", verdict: wrong, exclude_item: E3}
  - {text: "Prepare 1 mL of 2X PCR master mix by combining buffer, dNTPs, magnesium chloride, and polymerase, aliquot it, and store it at minus 20 degrees C; no template is added and no reaction is run.", verdict: wrong, exclude_item: E4}
  - {text: "Purify an already amplified DNA fragment from the reaction tube using a spin column, elute it in water, and measure its concentration; no amplification reaction is run in the protocol.", verdict: wrong, exclude_item: E4}
  # 执笔人已处理：原文 "none of the first six steps" 改为 "no step"（全文口径，见文件头 [待定项①]）；verdict 与 insufficient_detail 不变。
  - {text: "The protocol is titled 'PCR amplification of the target gene'. The objective field is empty, and no step mentions PCR, polymerase, primers, or thermal cycling; the steps describe DNA extraction from tissue and DNA quantification only.", verdict: wrong, why: "The objective is empty and the steps do not state the method either, so this is judged wrong under the lower-when-unsure rule with insufficient detail flagged.", insufficient_detail: true}

edge_examples:
  - {text: "Amplify the coding sequence by PCR with primers carrying restriction sites, digest the product, ligate it into an expression vector, and transform E. coli to obtain the plasmid.", verdict: tangential, category: upstream, exclude_item: E5, why: "PCR is performed before the principal procedure, and within the protocol the amplified product is ligated into a vector and transformed, so it is converted into a plasmid; the deliverable is the cloned plasmid rather than the amplified fragment."}
  # ★ (B) 已落地（2026-11-06，曹操裁甲）：本条的转化发生在 colony PCR **之前**、对象是连接产物；
  #   PCR 产物只跑胶、未在协议内被转化 ⇒ 新 E5 不适用。tangential 由 otr-1 支撑（交付物是确认的克隆）。
  - {text: "After transforming E. coli with the ligation mixture, pick colonies, run colony PCR with vector-specific primers for 30 cycles, and check the insert size on an agarose gel to confirm the clone.", verdict: tangential, category: downstream, why: "The cloning workflow is carried out inside the protocol and PCR is a downstream verification step applied to its product, so the protocol's deliverable is the confirmed clone rather than the amplified fragment."}
  - {text: "Amplify a 16S rRNA gene fragment by nested PCR: run 25 cycles with the outer primer pair, transfer 1 microliter of the product into a second reaction with the inner primer pair for 25 more cycles, and visualize the final product on an agarose gel.", verdict: on_topic, category: variant, why: "Nested PCR is a recognized thermal-cycled PCR format; the final amplified fragment is read directly on the gel without being converted into another molecule, and that fragment is the protocol's deliverable."}
  - {text: "Detect the viral target by loop-mediated isothermal amplification: incubate the primer set and Bst polymerase at a constant 65 degrees C for 40 minutes and read the turbidity.", verdict: wrong, category: analogue, exclude_item: E3, why: "LAMP is a related amplification method, but it runs at a constant temperature with no repeated thermal cycling, so no PCR is performed."}
  - {text: "Reverse transcribe total RNA into cDNA with oligo(dT) primers, amplify the target by 35 cycles of end-point PCR, and resolve the product on a 2% agarose gel.", verdict: on_topic, category: composite, why: "Reverse transcription and PCR are combined in one protocol, and the end-point gel band of the amplified product is the stated readout."}
  - {text: "Amplify the target cDNA on a real-time PCR instrument with a SYBR Green master mix for 40 cycles and report the Cq values normalized to a reference gene.", verdict: tangential, category: variant, exclude_item: E2, why: "Thermal-cycled PCR is performed, but the principal readout is real-time quantification by Cq, which belongs to the separate qPCR method."}
  - {text: "Reverse transcribe RNA into cDNA, quantify the transcript by real-time PCR with a TaqMan probe, and calculate relative expression by the delta-delta Cq method.", verdict: tangential, category: composite, exclude_item: E2, why: "Reverse transcription and PCR are both performed, but the stated final readout is relative quantification from Cq values, not the amplification result itself."}
  - {text: "Partition the reaction mixture into about 20,000 droplets, run 40 cycles of thermal cycling, and count the positive and negative droplets to report copies per microliter.", verdict: tangential, category: variant, exclude_item: E2, why: "Droplet PCR performs thermal-cycled amplification, but the stated readout is absolute quantification by partition counting rather than the amplification result itself."}

