#
# ── [V3-1] 证据出处规则（规范 §3，全局规则，本文件不重复定义）──────────────────
#   有效证据只有 (a) objective (b) 步骤正文；任一处陈述即可，must 与 on_topic_requires 同样适用。
#   **仅标题出现 "PCR" 不构成证据。**
#   认的词形：PCR / polymerase chain reaction / PCR amplification / RT-PCR / reverse transcription PCR /
#             nested PCR / colony PCR / touchdown PCR / real-time PCR / qPCR / digital PCR / ddPCR
#   ★ 「陈述做了 PCR」= 陈述**扩增反应被执行**。下列情形**不算**陈述：
#     "PCR tube"、"PCR purification kit"、"PCR-grade water"、"primers for PCR（只是设计）" 等把 PCR 当形容词或计划的写法。
#   ★ 命名了 PCR 且说明被执行，即同时陈述 must 1-3（与 SDS-PAGE v3.1 的处理一致）；
#     协议另写出模板、聚合酶、引物、循环参数的，按所写逐条核对。
#
# ── [V3-2] objective 为空（规范 §4.2，硬规则）──────────────────────────────────
#   空 ≠ 没执行。空但前 6 步陈述了方法证据 → 按步骤正常判；
#   空且前 6 步也无证据 → 拿不准往低判 → wrong，且 why 标 insufficient detail。
#
# ── 四个边界的决定（交接单 §5；本稿作者决定，一句话理由）────────────────────────
#   ① qPCR / RT-qPCR / Ct-Cq：**PCR 已被执行（must 全满足），但产出是定量读出，不是本方法的产出 -> tangential**
#      （落为 otr-3 + E2）。理由：名册里 PCR 与 qPCR 并列，qPCR 协议在 PCR 下判 tangential、在 qPCR 下判 on_topic，
#      两边不会同时 on_topic；且规范 §二 规定 wrong 只能由 must 不满足产生，把 qPCR 判 wrong 就得往 must 里塞读出要求，那是禁止的。
#      Ct/Cq、扩增曲线、熔解曲线**不得**作为本方法的 on-topic 读出。
#      RT-PCR 指「逆转录后再 PCR」；若协议陈述的是实时监测，则按 qPCR 处理。
#   ② 等温扩增（LAMP / RPA / NASBA 等）：**不算 PCR -> wrong**（落为 must-3「重复温度循环」不满足 + E3 + analogue）。
#      理由：PCR 的定义性操作是温度循环，不做成「等效步骤」，否则 must 失去可证实性。
#   ③ digital PCR（ddPCR）：**PCR 已被执行，但产出是分区计数定量 -> tangential**（同 ① 的 E2）。
#      这是最容易被推翻的一条：若曹操或组织方要把它改成 on_topic，只需把 E2 与 otr-3 里的 "digital" 删去。
#   ④ 只做引物设计 / 退火温度计算、不实际扩增：**wrong**（落为 must-3 不满足 + E1）。
#
# ── 变更说明（规范 §八）──────────────────────────────────────────────────────
#   v0.1 首稿。改了什么：由模板骨架（全占位）写成完整 10 字段。依据：规范 v3.4 §五/§六、交接单 §5、
#   SDS-PAGE v3.1 的格式与颗粒度。谁批的：尚无（待诸葛亮署名、曹操复核）。
#
# ── 写作留痕（给复核人）──────────────────────────────────────────────────────
#   · E2 与 E5 的对应反例是 **edge_examples 里判 tangential 的条目**（带 exclude_item），不是 neg_examples。
#     依据：SDS-PAGE v3.1 的 E5 / E8 同样如此处理（must 全满足，产出不是本方法的，不能判 wrong）。
#   · `scope_note` 整行未写：本稿不知道 83 名册里有没有 LAMP / dPCR 等方法，不能声明「名册缺口」；
#     而它们的归属已由 E2 / E3 写进判定，不需要再声明。
