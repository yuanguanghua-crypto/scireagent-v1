name: CI

# 为什么要有 CI（2026-10-19）
#
# 本地已有三层 pre-commit 闸门（删除能力闸门 / 映射表漂移 / 变异检测），
# 但它们**只在本机、且必须手动 `install_git_hooks.py` 才生效**。
# clone 一个新仓库后 .git/hooks/ 是空的 —— 于是"以为有闸门，实际一个都没有"。
# 这不是假设：2026-10-19 我自己就踩过（以为装了 hook，实际跑的是 162 行旧版，
# 当天新加的 --verify-map 压根没生效）。
#
# ⇒ 把同样的检查搬到服务端，不依赖任何人的本地状态。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 同一分支连续 push 时取消旧运行，省额度也省等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 全项目统一：测试走 sqlite，不依赖 PostgreSQL 服务
  DB_ENGINE: sqlite
  SECRET_KEY: ci-only-not-a-real-secret
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ── 1. 后端测试 ──────────────────────────────────────────────────────
  backend-tests:
    name: 后端测试（pytest / sqlite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与本地 3.13.12 保持一致；Django 5.1.3 支持 3.13
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest
        working-directory: backend
        run: |
          # ⚠️ 不用 `| tail`：管道会吃掉 pytest 的退出码（本地已踩过两次）
          python -B -m pytest -q --tb=short -p no:cacheprovider

  # ── 2. 变异检测：证明测试不是摆设 ────────────────────────────────────
  # 这是「让质疑成为流水线的一步」的落点：
  # 对关键守卫注入已知缺陷，测试必须变红；还绿就说明那些测试根本没在测东西。
  mutation-check:
    name: 变异检测（测试是否真有效）
    runs-on: ubuntu-latest
    needs: backend-tests      # 测试本身先绿，再问"它是否真的能发现问题"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 注入变异，测试必须变红
        # ⚠️ 脚本用 CI 的 python（没有 backend/venv/Scripts/python.exe 时会回退到 sys.executable）
        run: python -B scripts/mutation_check.py

      - name: 确认没有把变异残留下来
        run: |
          # 脚本自己会做 sha256 校验 + git diff 自检，这里再兜一层：
          # 有任何内容差异就说明还原失败，绝不能让带缺陷的代码继续往后走。
          if ! git diff --quiet; then
            echo "::error::变异未被还原，工作区仍有改动"
            git diff --stat
            exit 1
          fi

  # ── 3. 能力映射表是否还跟得上代码 ────────────────────────────────────
  capability-map:
    name: 端点映射表漂移检测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 校验 deliverables/capability_map.txt
        run: python -B scripts/capability_guard.py --verify-map

  # ── 4. 前端构建 ──────────────────────────────────────────────────────
  frontend-build:
    name: 前端构建（vite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 构建
        working-directory: frontend
        run: npx vite build --outDir dist --emptyOutDir
