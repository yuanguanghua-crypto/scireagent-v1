name: CI

# 为什么要有 CI（2026-10-19）
#
# 本地已有三层 pre-commit 闸门（删除能力闸门 / 映射表漂移 / 变异检测），
# 但它们**只在本机、且必须手动 `install_git_hooks.py` 才生效**。
# clone 一个新仓库后 .git/hooks/ 是空的 —— 于是"以为有闸门，实际一个都没有"。
# 这不是假设：2026-10-19 我自己就踩过（以为装了 hook，实际跑的是 162 行旧版，
# 当天新加的 --verify-map 压根没生效）。
#
# ⇒ 把同样的检查搬到服务端，不依赖任何人的本地状态。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 同一分支连续 push 时取消旧运行，省额度也省等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 默认 sqlite —— **只给「不需要 PG 专属路径」的 job 用**（前端构建、E2E、静态检查、变异检测）。
  # ⚠️ 2026-10-28：跑业务单测的 `backend-tests` 已单独覆盖为 PostgreSQL 16，原因见该 job 注释。
  DB_ENGINE: sqlite
  SECRET_KEY: ci-only-not-a-real-secret
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ── 1. 后端测试 ──────────────────────────────────────────────────────
  backend-tests:
    name: 后端测试（pytest / PostgreSQL 16）
    runs-on: ubuntu-latest
    # ── 2026-10-28：从 sqlite 切到 PostgreSQL 16 ─────────────────────────
    # 为什么必须切（全是本机实测，不是推断）：
    #   ① 模型里 `search_vector` 是 `if _USE_POSTGRES` 条件声明 ⇒ sqlite 下模型没有它，
    #      生产在用的全文检索那条分支**从未被任何自动化执行过**。
    #   ② sqlite 下 24 条用例被跳过、PG 下只跳 9 条 ⇒ 15 条只在 PG 跑。实跑后其中
    #      3 条 FTS 用例立刻暴露为**测试缺陷**（2 条造数据漏 slug 撞唯一约束、
    #      1 条断言 ORM 缓存缺 refresh_from_db）—— 它们从来没绿过，只是没人跑。
    #   ③ 另有 2 条「伪并发」用例：`unittest.TestCase` + 线程，子线程看不到未提交的
    #      fixture ⇒ 一条空转（一次分配都没发生）、一条在 PG 上**必然死锁**
    #      （10 线程抢同一唯一键，主线程 join() 互等）。已改 TransactionTestCase。
    #   ④ 耗时：sqlite 7m18s → PG 7m55s（+37s），可接受。
    # 版本对齐：生产 PostgreSQL **16.14**，此处 `postgres:16` —— 同主版本。
    # （本机验证用的是 17.11，属小版本超前；这 5 条失败都是结构性原因，不随版本变。）
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与本地 3.13.12 保持一致；Django 5.1.3 支持 3.13
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest
        working-directory: backend
        run: |
          # ⚠️ 不用 `pytest | tail`：管道会吃掉 pytest 的退出码（本地已踩过两次）
          set +e
          python -B -m pytest -q --tb=short -p no:cacheprovider > /tmp/pytest.log 2>&1
          RC=$?

          if [ $RC -ne 0 ]; then
            # ★ 把失败信息打成 annotation：
            #   GitHub 的 job log 下载需要 admin 权限，但 check-run 的
            #   annotations 接口匿名可读。所以把关键行 echo 成 ::error::，
            #   这样"CI 为什么红"不用登录也能查到。
            #   （限制：每 step 最多约 10 条 annotation，所以只取最关键的）
            {
              grep -E '^(FAILED|ERROR)' /tmp/pytest.log | head -6
              echo '--- 输出尾部 ---'
              grep -E 'AssertionError|ImportError|ModuleNotFoundError|Error:' /tmp/pytest.log | head -4
            } | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            # ★ 成功时也要自证「真的跑了」：只报 success 无法区分
            #   "跑了 2734 个用例" 与 "一个都没收集到"。
            # ⚠️ 不能用 `grep 'passed'` 取汇总行 —— 实测本仓库在有 warnings 时
            #    pytest -q 会把 "N passed" 整行吞掉（grep 结果为空，踩过）。
            #    改用 scripts/test_result_summary.py（纯标准库，专门处理这个坑）。
            python ../scripts/test_result_summary.py /tmp/pytest.log 2>/dev/null | tail -2 \
              | while IFS= read -r line; do
                  echo "::notice::$line"
                done
          fi

          cat /tmp/pytest.log
          exit $RC

  # ── 2. 变异检测：证明测试不是摆设 ────────────────────────────────────
  # 这是「让质疑成为流水线的一步」的落点：
  # 对关键守卫注入已知缺陷，测试必须变红；还绿就说明那些测试根本没在测东西。
  mutation-check:
    name: 变异检测（测试是否真有效）
    runs-on: ubuntu-latest
    needs: backend-tests      # 测试本身先绿，再问"它是否真的能发现问题"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 注入变异，测试必须变红
        # ⚠️ 脚本用 CI 的 python（没有 backend/venv/Scripts/python.exe 时会回退到 sys.executable）
        # ★ 关键：不能只看这个 step 是不是绿的 ——
        #   "success" 也可能来自"脚本早退/没跑任何变异"。
        #   所以把每个变异的判定结果打成 annotation，
        #   让"真的注入了、真的变红了"这件事**可被外部核验**。
        run: |
          set +e
          python -B scripts/mutation_check.py > /tmp/mut.log 2>&1
          RC=$?

          grep -E '注入变异|✅ 变红|❌ 仍绿|结果：有效|未留残留' /tmp/mut.log \
            | head -9 \
            | while IFS= read -r line; do
                echo "::notice::$line"
              done

          cat /tmp/mut.log
          exit $RC

      - name: 确认没有把变异残留下来
        run: |
          # 脚本自己会做 sha256 校验 + git diff 自检，这里再兜一层：
          # 有任何内容差异就说明还原失败，绝不能让带缺陷的代码继续往后走。
          if ! git diff --quiet; then
            echo "::error::变异未被还原，工作区仍有改动"
            git diff --stat
            exit 1
          fi

  # ── 3. 能力映射表是否还跟得上代码 ────────────────────────────────────
  capability-map:
    name: 端点映射表漂移检测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 校验 deliverables/capability_map.txt
        # ★ 同样自证：success 可能是"真的比对了"，也可能是"文件不存在提前退出"
        run: |
          set +e
          python -B scripts/capability_guard.py --verify-map > /tmp/map.log 2>&1
          RC=$?
          tail -4 /tmp/map.log | while IFS= read -r line; do
            echo "::notice::$line"
          done
          cat /tmp/map.log
          exit $RC

  # ── 5. 删除闸门（绕过本地 hook 的兜底）──────────────────────────────
  # ★ 2026-10-20 补：之前 CI 的 4 个 job 都**不检查"这次提交删了什么"**。
  #   实测证据：在一个没有 hook 的新 clone 里删掉
  #   frontend/src/views/workspace/ProductEditPage.vue 并 commit（本地无闸门、放行），
  #   然后在同样的代码上跑 CI 里的 `--verify-map` —— 结果仍是 [OK]，EXIT=0。
  #   ⇒ 也就是说：绕过 hook（--no-verify，或干脆在新 clone 里工作）的删除，
  #     原来的 CI 会**全绿放行**。这是真缺口，不是理论问题。
  deletion-guard:
    name: 删除闸门（绕过 hook 的兜底）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 需要 base commit 才能 diff 出删除项

      - name: 闸门自检（必须先证明它能拦住已知危险删除）
        # ★ 这里验证的不是业务代码，而是**闸门本身有没有效**。
        #   如果哪天 --audit 变成恒放行，这一步会红，而不是静默失效。
        run: |
          set +e
          python3 -B scripts/capability_guard.py --audit --git-rev HEAD \
            --paths frontend/src/views/workspace/ProductEditPage.vue \
            > /tmp/selfcheck.log 2>&1
          RC=$?
          if [ $RC -eq 0 ]; then
            echo "::error::闸门自检失败：对「已知会失去唯一入口」的删除竟然放行（exit 0）"
            head -20 /tmp/selfcheck.log
            exit 1
          fi
          echo "::notice::闸门自检通过：对 ProductEditPage.vue 的删除正确 BLOCK（exit $RC）"
          grep -E 'BLOCK' /tmp/selfcheck.log | head -2 | while IFS= read -r line; do
            echo "::notice::$line"
          done

      - name: 审查本次提交实际删除的文件
        env:
          BASE_PUSH: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          BASE="${BASE_PUSH:-$BASE_PR}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ]; then
            echo "::notice::无 base commit（首次推送/手动触发），本次跳过删除审查"
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::notice::base commit $BASE 不在本地（浅克隆），本次跳过；如需完整审查请用 fetch-depth: 0"
            exit 0
          fi

          DELETED="$(git diff --name-only --diff-filter=D "$BASE" HEAD || true)"
          if [ -z "$DELETED" ]; then
            echo "::notice::本次提交未删除任何文件"
            exit 0
          fi

          N="$(printf '%s\n' "$DELETED" | grep -c . || true)"
          echo "::notice::本次删除 $N 个文件，启动删除闸门"
          # shellcheck disable=SC2086
          python3 -B scripts/capability_guard.py --audit --git-rev "$BASE" --paths $DELETED > /tmp/del.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            grep -E 'BLOCK|WARN' /tmp/del.log | head -6 | while IFS= read -r line; do
              echo "::error::$line"
            done
            cat /tmp/del.log
            exit 1
          fi
          echo "::notice::删除审查通过：未发现能力入口丢失"
          exit 0


  frontend-build:
    name: 前端构建（vite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 构建
        working-directory: frontend
        run: npx vite build --outDir dist --emptyOutDir

  # ── 6. E2E 冒烟（空库 + 最小种子）─────────────────────────────────────
  #
  # 为什么只跑这个子集，而不是全部 854 个用例：
  #   854 个用例里 29 个 spec 是 @write（要造/清数据），大量用例外依赖开发库里的历史数据
  #   （127 产品 / 983 订单 / 各类实体）。CI 是**全新空库**，照搬必然大面积假失败。
  #   ⇒ 这里只跑「渲染 / 可访问性 / 设计令牌」这三类**只读**断言（约 81 例），
  #     配 `backend/seed_e2e_ci.py` 造的最小数据（账号 / org / 3 产品 / 1 订单）。
  #   ⚠️ **CI 绿 ≠ 全站绿**：这只是"页面还能不能渲染 + 有没有 a11y 回归"的底线闸门。
  #      全量 854 例仍只在本地跑（见 docs/e2e/COVERAGE_STATUS.md）。
  #
  # 为什么先跑 preflight：把"环境没起来"和"代码坏了"分开，避免 CI 报一堆看不懂的 element not found。
  e2e-smoke:
    name: E2E 冒烟（空库 + 最小种子 / chromium）
    runs-on: ubuntu-latest
    needs: backend-tests
    env:
      DB_ENGINE: sqlite
      SECRET_KEY: ci-only-not-a-real-secret
      PYTHONDONTWRITEBYTECODE: "1"
      # Linux runner 上没有系统 Edge ⇒ 清空 channel 走 Playwright 自带 chromium
      # （config 里 `PW_CHANNEL` **存在但为空** ⇒ undefined ⇒ bundled chromium）
      PW_CHANNEL: ""
      BASE_URL: http://localhost:5173
      E2E_API_BASE: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装后端依赖
        working-directory: backend
        run: pip install -r requirements.txt

      - name: 建空库 + 迁移
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: 灌最小种子（幂等）
        working-directory: backend
        run: python manage.py shell -c "exec(open('seed_e2e_ci.py').read())"

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 chromium（含系统依赖）
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 起后端（:8000）
        working-directory: backend
        run: nohup python manage.py runserver 8000 --noreload > /tmp/be.log 2>&1 &

      - name: 起前端（:5173）
        working-directory: frontend
        run: nohup npx vite --port 5173 --strictPort > /tmp/fe.log 2>&1 &

      - name: 等两个端口就绪（最多 90s）
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8000/api/v1/products/ >/dev/null && curl -sf http://localhost:5173/ >/dev/null; then
              echo "两个服务已就绪"; exit 0
            fi
            sleep 2
          done
          echo "::error::服务 90s 内未就绪"; echo "--- backend log ---"; tail -40 /tmp/be.log
          echo "--- frontend log ---"; tail -40 /tmp/fe.log; exit 1

      - name: 环境自检（preflight）
        working-directory: frontend
        run: node e2e/preflight.cjs

      - name: E2E 冒烟（81 例只读）
        working-directory: frontend
        run: npm run test:e2e:ci

      - name: 失败现场（截图/trace）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: 服务日志（失败时）
        if: failure()
        run: |
          echo "--- backend ---"; tail -60 /tmp/be.log || true
          echo "--- frontend ---"; tail -60 /tmp/fe.log || true

  # ── 6.5 P0/P1/P2 覆盖补齐（探针栈 + 夹具 / 统一入口）──────────────────
  #
  # 为什么单独一个 job：这批用例需要**独立的 DB 副本 + 7 个 probe_* 账号 + 业务夹具
  #   （已开票订单/PO 附件/completed 单/quoted 单）**，而 e2e-smoke 用的是空库+最小种子。
  #   混在一起会把 smoke 的前提搞脏。
  #
  # 跑的是 `scripts/run_all_tests.py --only fixtures,e2e-probe`：
  #   fixtures   → 三套夹具一键重置（保证可重复；P0/P1/P2 里有会推进状态的用例）
  #   e2e-probe  → p0-* / p1-* / p2-* 全部 spec
  # 覆盖内容见 docs/e2e/GAP_REGISTER.md（当前 P0/P1 已清零，仅 2 条有明确原因的缺口）。
  e2e-probe:
    name: E2E 覆盖补齐（探针栈 + 夹具 / chromium）
    runs-on: ubuntu-latest
    needs: backend-tests
    env:
      DB_ENGINE: sqlite
      SECRET_KEY: ci-only-not-a-real-secret
      PYTHONDONTWRITEBYTECODE: "1"
      PW_CHANNEL: ""
      BASE_URL: http://localhost:5174
      PROBE_BASE: http://127.0.0.1:8011
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装后端依赖
        working-directory: backend
        run: pip install -r requirements.txt

      - name: 建空库 + 迁移
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: 复制 DB 副本（夹具只跑在副本上，避免污染 smoke 用的主库）
        working-directory: backend
        run: cp db.sqlite3 db_probe.sqlite3

      - name: 装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 装 chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 起后端（:8011，指向副本）
        working-directory: backend
        env:
          SCIREAGENT_DB_NAME: ${{ github.workspace }}/backend/db_probe.sqlite3
        run: nohup python manage.py runserver 127.0.0.1:8011 --noreload > /tmp/be-probe.log 2>&1 &

      - name: 起前端（:5174，代理到 8011）
        working-directory: frontend
        env:
          VITE_API_PROXY: http://127.0.0.1:8011
        run: nohup npx vite --port 5174 --strictPort > /tmp/fe-probe.log 2>&1 &

      - name: 等两个端口就绪（最多 90s）
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8011/api/v1/health/ >/dev/null && curl -sf http://127.0.0.1:5174/ >/dev/null; then
              echo "两个服务已就绪"; exit 0
            fi
            sleep 2
          done
          echo "::error::服务 90s 内未就绪"
          echo "--- backend ---"; tail -40 /tmp/be-probe.log
          echo "--- frontend ---"; tail -40 /tmp/fe-probe.log; exit 1

      - name: 跑统一入口（fixtures + e2e-probe）
        run: python scripts/run_all_tests.py --only fixtures,e2e-probe

      - name: 失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-probe-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            _test_runs/
          retention-days: 7
          if-no-files-found: ignore

      - name: 服务日志（失败时）
        if: failure()
        run: |
          echo "--- backend ---"; tail -80 /tmp/be-probe.log || true
          echo "--- frontend ---"; tail -40 /tmp/fe-probe.log || true

  # ── 7. L5 前后端契约（字段漂移）───────────────────────────────────────
  #
  # 为什么需要：本轮修的 D3/D6 是同一类缺陷 —— 前端读了一个**后端不返回的字段**，
  #   判定恒真/恒假，页面上完全看不出来。后端单测只测自己的形状、E2E 走真实数据也不报错
  #   ⇒ **没有任何现有闸门能拦**。这个 job 填的就是这个洞。
  #
  # 输入是 drf-spectacular 生成的 OpenAPI schema（不是真实响应）⇒ 不依赖数据、不用起服务，
  #   所以又快又不会因"种子数据太薄"而假失败（第一版抓真实响应，实测在薄种子下大面积假 FAIL）。
  contract-check:
    name: L5 契约检查（字段漂移）
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite
      SECRET_KEY: ci-only-not-a-real-secret
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装后端依赖
        working-directory: backend
        run: pip install -r requirements.txt

      - name: 建空库 + 迁移（spectacular 需要能连 DB）
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: 契约比对（基线 docs/e2e/API_CONTRACT_SCHEMA.json）
        run: python scripts/check_api_contract.py --verbose

  # ── 7.5 权限闸门（L7 棘轮）────────────────────────────────────────────
  #
  # 为什么要有：本仓库 settings 里**没有** DEFAULT_PERMISSION_CLASSES ⇒ DRF 落回
  # `AllowAny` ⇒ **任何忘记写 permission_classes 的写端点都是匿名可写**。
  # 这不是假设：`SKUViewSet` 曾因此"匿名可写 SKU"，靠人工发现才补上。
  #
  # 为什么不用 grep 数 permission_classes：数出现次数证明不了安全。
  # 视图可能通过 `@action(permission_classes=...)`、`get_permissions()` 动态返回、
  # 或 `as_view()` 的 initkwargs 传权限 —— grep 全部看不准。本脚本**实例化真实视图类**
  # 去读 get_permissions()，与生产运行时的判定一致。
  #
  # 闸门形态是**棘轮（ratchet）而不是一次性大签字**：要求 40 个端点全部
  # reviewed=true 才 PASS，最省事的过法就是批量写 true ⇒ 假签字 ⇒ 闸门退化成仪式。
  # 所以只拦两件事：**新出现的 P0/DYNAMIC** 与 **存量端点的严重度升级**。
  # 存量 P1（匿名可读）作为可见债务打印出来，随处置逐条签字。
  # 本闸门已做过变异验证：把 VerifiedApproveView 的 IsStaffUser 改成 AllowAny
  # ⇒ 立刻报 `[新增 P0] POST /api/v1/verified/<int:pk>/approve/` 并 FAIL。
  permission-check:
    name: L7 权限闸门（无新增匿名写口）
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite
      SECRET_KEY: ci-only-not-a-real-secret
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装后端依赖
        working-directory: backend
        run: pip install -r requirements.txt

      - name: 权限审计（对比基线 docs/e2e/PERMISSION_BASELINE.json）
        run: python scripts/permission_audit.py --check

  # ── 7.6 配置一致性闸门（横切面 A）──────────────────────────────────────
  #
  # 为什么要有：回看本项目所有**生产级**事故，一半以上的根因不在功能代码里，
  # 而在配置差异 —— `ALLOWED_HOSTS` 漏配导致全部端点 400（性能首测"8ms 极快"的真相）、
  # `DEBUG` 默认 True 泄露 traceback、wsgi 默认指向 development。
  # 旧测试框架（7 维 × 7 层）**一个都覆盖不到**。
  #
  # 为什么纯静态检查、不装依赖：不导入 Django ⇒ 不受当前环境变量影响，
  # 查的是"文件里怎么写的"而不是"此刻解析成什么"；且毫秒级，无 DB 需求。
  config-parity:
    name: 配置一致性（dev/prod 差异）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查配置一致性（对应 FAILURE_MODES.md 第 6 类）
        run: python scripts/config_parity.py --verbose

  # ── 7.7 迁移 state 一致性（**必须跑在 PostgreSQL 下**）─────────────────
  #
  # 为什么必须在 PG 下：`commerce`/`knowledge` 的 `search_vector` 字段是
  # `if _USE_POSTGRES:` 条件定义的，而 sqlite 分支会把 `django.contrib.postgres`
  # 从 INSTALLED_APPS 里移除 ⇒ 模型里根本没这个字段
  # ⇒ 在 sqlite 下跑 `makemigrations --check` **永远返回 "No changes detected"**，
  # 等于什么都没检查。本项目就因此让一个 P0 陷阱活到今天：
  # 生产库里 `search_vector` 列和 9 个索引早就存在（0008 用 RunPython 原生 SQL 建的），
  # 但 migration state 里没有 ⇒ 谁生成普通 AddField 迁移并 migrate，
  # 空库会撞 "column already exists"、生产部署会中断。
  # 已于 2026-10-21 用 state-only 迁移（SeparateDatabaseAndState）对齐。
  migration-state-check:
    name: 迁移 state 一致性（PostgreSQL）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      SECRET_KEY: ci-only-not-a-real-secret
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装后端依赖
        working-directory: backend
        run: pip install -r requirements.txt

      - name: 检查模型与迁移是否一致（PG 环境）
        working-directory: backend
        run: |
          python manage.py makemigrations --check --dry-run ||
            (echo "::error::模型与迁移不一致 —— 见 backend/apps/*/migrations/。"
                   "⚠️ 不要在 sqlite 环境下生成迁移：search_vector 等 PG 专属字段"
                   "在 sqlite 下不存在，会生成错误的删除迁移。" && exit 1)

  # ── 8. 前端组件单测（vitest）─────────────────────────────────────────
  #
  # 为什么要有：项目 59 个页面 / 44 个组件，此前**零组件单测**，全靠 E2E（分钟级）。
  # 而组件里有大量"条件渲染 / props 默认值 / 可访问名"这类**毫秒级就能发现**的逻辑错误。
  # 实例：2026-10-21 单测第一次跑就发现两个真问题 ——
  #   ① Element Plus 的 el-input **吞掉 id** ⇒ 之前给 label 加 for 的 a11y 修法**其实没生效**
  #   ② AppSelect 里的 `|| 'Select an option'` 兜底是**无效代码**（EP 会用自己的 'Please select' 覆盖）
  # 这类问题 E2E 都发现不了（页面看起来完全正常）。
  unit-tests:
    name: 前端组件单测（vitest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 组件单测
        working-directory: frontend
        run: npm run test:unit

  # ── 9. 迁移演练（台账）───────────────────────────────────────────────
  #
  # 已发生过的真实事故（本脚本就是为它写的）：`documents/0006` 漏了 commerce 的跨 app 依赖
  # ⇒ 回填抛 `FieldError: Cannot resolve keyword 'current_sds_id'`。
  # ⚠️ `manage.py check` **查不出这个**（它只查 model 层，不查迁移图的跨 app 依赖）。
  #
  # 这个 job 对 10 个 app 各跑一遍完整链路（正向 → 造存量数据 → 应用 → 幂等重放 → 反向回滚），
  # 全部在**独立临时 sqlite** 上，不碰任何真实库。约 2 分钟。
  # 结果同时重写 docs/e2e/MIGRATION_DRILL_LEDGER.md（若与仓库里不一致，说明需要更新台账）。
  migration-drill:
    name: 迁移演练（10 app / 74 迁移）
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite
      SECRET_KEY: ci-only-not-a-real-secret
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装后端依赖
        working-directory: backend
        run: pip install -r requirements.txt

      - name: 全量演练（重写台账）
        run: python scripts/migration_ledger.py

      - name: 台账是否被本次运行改变（提示提交）
        if: always()
        run: |
          if ! git diff --quiet -- docs/e2e/MIGRATION_DRILL_LEDGER.md; then
            echo "::warning::台账有变化（迁移/环境变动）⇒ 请把 docs/e2e/MIGRATION_DRILL_LEDGER.md 一并提交"
            git diff --stat -- docs/e2e/MIGRATION_DRILL_LEDGER.md
          else
            echo "台账无变化"
          fi
